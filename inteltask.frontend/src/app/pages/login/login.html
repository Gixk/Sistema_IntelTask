<div class="login-wrapper">
  <div class="login-content">
    <!-- Panel izquierdo -->
    <div class="left-panel">
      <tui-icon icon="@tui.columns-3-cog" class="icon"></tui-icon>
      <h1>IntelTask</h1>
      <p>Sistema Gestión de Tareas y Permisos</p>
    </div>

    <!-- Panel derecho -->
    <div class="right-panel">
      <img src="assets/images/logoPoderJudicial.png" alt="Poder Judicial" class="logo" />
      <p class="subtitle">Ingrese los datos que se le solicitan</p>

      <form [formGroup]="form">
        <tui-textfield>
          <label tuiLabel>Correo electrónico</label>
          <input placeholder="usuario@gmail.com" tuiTextfield />
        </tui-textfield>


        <tui-textfield class="alineado">
          <label tuiLabel>Contraseña</label>
          <input tuiTextfield type="password" placeholder="Ingrese contraseña" />
        </tui-textfield>

        <button tuiButton size="s" appearance="secondary" class="forgot-password">Nueva contraseña</button>

        <button tuiButton type="submit" appearance="primary" class="btn-login" (click)="login2()">
          Ingresar
        </button>
      </form>


    </div>
  </div>
</div>
